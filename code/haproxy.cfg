# ═══════════════════════════════════════════════════════════════════════════════
#  HAPROXY CONFIGURATION
#  Distributed Moodle Database Synchronization
# ═══════════════════════════════════════════════════════════════════════════════
# 
#  Project: Eventual Consistency in Distributed Moodle Learning Management Systems
#  Component: Load Balancer & WebSocket Proxy
#  Location: /etc/haproxy/haproxy.cfg on VM1 (172.20.10.4)
# 
#  Features:
#  - HTTP load balancing across 3 Moodle instances (round-robin)
#  - WebSocket proxy for Yjs server connections
#  - Health checking for backend servers
#  - Session persistence for Moodle (sticky sessions)
# 
#  Author: Distributed Moodle Sync Project
#  Version: 2.0.0
#  Last Updated: November 2025
# 
# ═══════════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════════
#  GLOBAL SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

global
    # Logging configuration
    log /dev/log local0
    log /dev/log local1 notice
    
    # Chroot for security
    chroot /var/lib/haproxy
    
    # Stats socket for runtime management
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    
    # User/group to run as
    user haproxy
    group haproxy
    
    # Run in daemon mode
    daemon
    
    # Performance tuning
    maxconn 4096
    tune.ssl.default-dh-param 2048
    
    # SSL/TLS settings (for future HTTPS support)
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

# ═══════════════════════════════════════════════════════════════════════════════
#  DEFAULT SETTINGS
# ═══════════════════════════════════════════════════════════════════════════════

defaults
    # Logging
    log     global
    
    # Default mode
    mode    http
    
    # Logging options
    option  httplog
    option  dontlognull
    option  http-server-close
    option  forwardfor except 127.0.0.0/8
    option  redispatch
    
    # Retries on connection failure
    retries 3
    
    # Timeouts
    timeout connect 10s
    timeout client  30s
    timeout server  30s
    timeout http-request 10s
    timeout http-keep-alive 10s
    timeout queue   60s
    
    # Error files
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# ═══════════════════════════════════════════════════════════════════════════════
#  STATISTICS DASHBOARD
# ═══════════════════════════════════════════════════════════════════════════════

frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE
    stats auth admin:moodle_sync_2025
    stats hide-version

# ═══════════════════════════════════════════════════════════════════════════════
#  MOODLE HTTP FRONTEND (Port 80)
# ═══════════════════════════════════════════════════════════════════════════════

frontend moodle_front
    # Bind to port 80 for HTTP traffic
    bind *:80
    
    mode http
    
    # Request logging
    option httplog
    
    # Add headers for debugging
    http-request set-header X-Forwarded-Proto http
    http-request set-header X-HAProxy-Server %s
    
    # Health check endpoint
    acl is_health_check path /haproxy-health
    http-request return status 200 content-type text/plain string "OK" if is_health_check
    
    # Default backend
    default_backend moodle_back

# ═══════════════════════════════════════════════════════════════════════════════
#  MOODLE HTTP BACKEND
# ═══════════════════════════════════════════════════════════════════════════════

backend moodle_back
    mode http
    
    # Load balancing algorithm
    balance roundrobin
    
    # Sticky sessions using PHP session cookie
    cookie SERVERID insert indirect nocache
    
    # Health checks
    option httpchk GET /login/index.php
    http-check expect status 200
    
    # Backend servers
    # VM1 - Local (this machine)
    server moodle1 127.0.0.1:8080 check cookie moodle1 weight 100
    
    # VM2 - Remote
    server moodle2 172.20.10.5:8080 check cookie moodle2 weight 100
    
    # VM3 - Remote
    server moodle3 172.20.10.6:8080 check cookie moodle3 weight 100
    
    # Fallback options
    option redispatch
    retries 3

# ═══════════════════════════════════════════════════════════════════════════════
#  YJS WEBSOCKET FRONTEND (Port 1234)
# ═══════════════════════════════════════════════════════════════════════════════

frontend yjs_front
    # Bind to port 1234 for WebSocket connections
    bind *:1234
    
    mode http
    
    # Extended timeouts for WebSocket connections
    timeout client 3600s
    timeout http-request 60s
    
    # WebSocket upgrade handling
    acl is_websocket hdr(Upgrade) -i WebSocket
    acl is_websocket hdr(Connection) -i Upgrade
    
    # Use WebSocket backend for WebSocket requests
    use_backend yjs_back if is_websocket
    
    # Default to WebSocket backend anyway (for direct connections)
    default_backend yjs_back

# ═══════════════════════════════════════════════════════════════════════════════
#  YJS WEBSOCKET BACKEND
# ═══════════════════════════════════════════════════════════════════════════════

backend yjs_back
    mode http
    
    # Extended timeouts for persistent WebSocket connections
    timeout server 3600s
    timeout tunnel 3600s
    timeout connect 10s
    
    # Single server (Yjs runs only on VM1)
    server yjs1 127.0.0.1:2345 check
    
    # WebSocket-specific options
    option http-server-close
    
    # Health check using HTTP endpoint
    option httpchk GET /health
    http-check expect status 200

